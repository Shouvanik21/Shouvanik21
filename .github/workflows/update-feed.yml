name: Update Web-Swing Feed
on:
  schedule: [{ cron: "0 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const user = context.repo.owner;
            const { data } = await github.rest.activity.listPublicEventsForUser({ username: user, per_page: 50 });
            const commits = [];
            for (const e of data) {
              if (e.type !== 'PushEvent') continue;
              for (const c of [...(e.payload.commits || [])].reverse()) {
                const msg = c.message.split('\n')[0].replace(/[|<>`]/g, '');
                commits.push(`- 🕷️ [\`${e.repo.name.split('/')[1]}\`](https://github.com/${e.repo.name}/commit/${c.sha}) ${msg}`);
                if (commits.length === 5) break;
              }
              if (commits.length === 5) break;
            }
            const body = commits.length ? commits.join('\n') : '🕷️ *No recent swings detected.*';
            const readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(/<!--COMMITS:START-->[\s\S]*<!--COMMITS:END-->/, `<!--COMMITS:START-->\n${body}\n<!--COMMITS:END-->`);
            fs.writeFileSync('README.md', updated);
      - name: Commit
        run: |
          git config user.name "web-slinger-bot"
          git config user.email "bot@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh web-swing feed" && git push
